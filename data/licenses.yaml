    Лицензиар предоставляет вам авторско-правовую лицензию на программное обеспечение, позволяющую совершать любые действия с программным обеспечением, которые в ином случае нарушали бы авторские права лицензиара на него, для любых разрешенных целей. Однако вы вправе распространять программное обеспечение только в соответствии с разделом [Лицензия на распространение](#distribution-license), а также вносить изменения или создавать новые произведения на основе программного обеспечения только в соответствии с разделом [Лицензия на изменения и новые произведения](#changes-and-new-works-license).

