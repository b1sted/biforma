    Лицензиар предоставляет вам патентную лицензию на программное обеспечение, которая охватывает патентные притязания, на лицензирование которых лицензиар имеет право или получит такое право и которые были бы нарушены вами при использовании программного обеспечения.

    ## Некоммерческие цели

    Любая некоммерческая цель является разрешенной целью.

    ## Личное использование

    Личное использование в целях исследований, экспериментов и тестирования для расширения общественных знаний, личного обучения, частных развлечений, хобби-проектов, любительских занятий или религиозных обрядов без какого-либо предполагаемого коммерческого применения является использованием в разрешенных целях.

    ## Некоммерческие организации

    Использование любой благотворительной организацией, образовательным учреждением, общественной исследовательской организацией, организацией общественной безопасности или здравоохранения, природоохранной организацией либо государственным учреждением является использованием в разрешенных целях независимо от источника финансирования или обязательств, возникающих в результате такого финансирования.

