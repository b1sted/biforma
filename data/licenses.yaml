    > Required Notice: Copyright [Author] ([Website])

    ## Лицензия на изменения и новые произведения

    Лицензиар предоставляет вам дополнительную авторско-правовую лицензию на внесение изменений и создание новых произведений на основе программного обеспечения для любых разрешенных целей.

