    Если вы предъявите какую-либо письменную претензию или иск о том, что программное обеспечение нарушает какой-либо патент или способствует его нарушению, действие вашей патентной лицензии на программное обеспечение, предоставленной на настоящих условиях, немедленно прекращается. Если такую претензию предъявляет ваша компания, действие вашей патентной лицензии немедленно прекращается в отношении работы от имени вашей компании.

    ## Нарушения

    При первом получении письменного уведомления о том, что вы нарушили какое-либо из настоящих условий или совершили с программным обеспечением действия, не охватываемые вашими лицензиями, действие ваших лицензий тем не менее может продолжиться, если вы полностью устраните несоответствие настоящим условиям и предпримете практические шаги для исправления прошлых нарушений в течение 32 дней с момента получения уведомления. В противном случае действие всех ваших лицензий немедленно прекращается.

    ## Отказ от ответственности

    ***В той степени, в которой это допускается законом, программное обеспечение предоставляется на условиях «как есть» (as is), без каких-либо явных или подразумеваемых гарантий или условий, и лицензиар не несет перед вами ответственности за любые убытки или ущерб, возникающие из настоящих условий, использования либо свойств программного обеспечения, по любым видам правовых претензий.***

    ## Определения

    **Лицензиар** — это физическое или юридическое лицо, предлагающее настоящие условия, а **программное обеспечение** — это программное обеспечение, которое лицензиар предоставляет на настоящих условиях.

    **Вы** означает физическое или юридическое лицо, принимающее настоящие условия.

    **Ваша компания** — это любое юридическое лицо, индивидуальный предприниматель или организация иного рода, на которую вы работаете, а также все организации, которые контролируют данную организацию, находятся под ее контролем либо находятся под общим контролем с ней. **Контроль** означает владение практически всеми активами организации либо право определять ее руководство и политику посредством права голоса, договора или иным образом. Контроль может быть прямым или косвенным.

    **Ваши лицензии** — это все лицензии на программное обеспечение, предоставленные вам на настоящих условиях.

