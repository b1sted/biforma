    Настоящие условия не дают вам права сублицензировать или передавать какие-либо из ваших лицензий кому-либо еще, а также не препятствуют лицензиару предоставлять лицензии кому-либо еще. Настоящие условия не подразумевают предоставления каких-либо иных лицензий.

