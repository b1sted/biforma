# Optional metadata for section groups.
#
# Keys must match the `group` front matter value exactly. The theme looks up
# each group here to render its icon and description; missing entries fall
# back to the first page's `group_icon`/`group_description` params, then to
# neutral defaults.
#
# Example:
# - key: "Getting Started"
#   icon: "🚀"
#   description: "Installation, configuration and first steps"
