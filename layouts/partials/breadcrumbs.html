<nav class="breadcrumbs" aria-label="Хлебные крошки">
    <a href="{{ site.Home.RelPermalink }}" class="breadcrumb" aria-label="Главная">
        <svg width="14" height="14" aria-hidden="true">
            <use href="{{ "icons.svg#icon-home" | relURL }}"></use>
        </svg>
    </a>
    {{ if not .IsHome }}
        {{ range .Ancestors.Reverse }}
            {{ if not .IsHome }}
                <span class="breadcrumb-sep" aria-hidden="true">›</span>
                <a href="{{ .RelPermalink }}" class="breadcrumb">{{ .Title }}</a>
            {{ end }}
        {{ end }}
        <span class="breadcrumb-sep" aria-hidden="true">›</span>
        <span class="breadcrumb-current" aria-current="page">{{ .Title }}</span>
    {{ end }}
</nav>
