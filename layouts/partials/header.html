<header class="header">
    <div class="header-container">
        <button type="button" class="menu-toggle" aria-label="{{ i18n "aria_open_menu" }}">
            <svg width="20" height="20" aria-hidden="true">
                <use href="{{ "icons.svg#icon-menu" | relURL }}"></use>
            </svg>
        </button>

        <a href="{{ site.Home.RelPermalink }}" class="header-logo">
            {{ with site.Params.logo }}
                <span class="header-logo-icon">{{ . }}</span>
            {{ end }}
            <span class="header-logo-text">{{ site.Title }}</span>
        </a>

        <div class="header-search">
            <button type="button" class="search-trigger" aria-label="{{ i18n "aria_search" }}">
                <svg width="16" height="16" aria-hidden="true">
                    <use href="{{ "icons.svg#icon-search" | relURL }}"></use>
                </svg>
                <span>{{ site.Params.searchPlaceholder | default (i18n "search_placeholder") }}</span>
                <kbd>Ctrl+K</kbd>
            </button>
        </div>

        <div class="header-actions">
            {{ with site.Params.mainSite }}
                <a href="{{ . }}" class="header-link" target="_blank" rel="noopener noreferrer">
                    <svg width="18" height="18" aria-hidden="true">
                        <use href="{{ "icons.svg#icon-home" | relURL }}"></use>
                    </svg>
                    <span>{{ i18n "nav_home" }}</span>
                </a>
            {{ end }}

            {{ with site.Params.donate }}
                <a href="{{ . }}" class="header-link" target="_blank" rel="noopener noreferrer">
                    <svg width="18" height="18" aria-hidden="true">
                        <use href="{{ "icons.svg#icon-heart" | relURL }}"></use>
                    </svg>
                    <span>{{ i18n "nav_donate" | default "Donate" }}</span>
                </a>
            {{ end }}

            {{ with site.Params.github }}
                <a href="{{ . }}" class="header-link" target="_blank" rel="noopener noreferrer">
                    <svg width="18" height="18" aria-hidden="true">
                        <use href="{{ "icons.svg#icon-github" | relURL }}"></use>
                    </svg>
                    <span>GitHub</span>
                </a>
            {{ end }}

            <button type="button" class="search-trigger-mobile header-link" aria-label="{{ i18n "aria_open_search" }}" style="display:none">
                <svg width="18" height="18" aria-hidden="true">
                    <use href="{{ "icons.svg#icon-search" | relURL }}"></use>
                </svg>
            </button>

            <button type="button" class="theme-toggle" aria-label="{{ i18n "aria_toggle_theme" }}">
                <svg id="theme-icon-sun" width="18" height="18" style="display: none" aria-hidden="true">
                    <use href="{{ "icons.svg#icon-sun" | relURL }}"></use>
                </svg>
                <svg id="theme-icon-moon" width="18" height="18" aria-hidden="true">
                    <use href="{{ "icons.svg#icon-moon" | relURL }}"></use>
                </svg>
            </button>
        </div>
    </div>
</header>
