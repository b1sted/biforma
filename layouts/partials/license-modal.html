{{- $licenseDataURL := partialCached "license-data.html" . "licenses" -}}
<div id="license-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-license-data-url="{{ $licenseDataURL }}" style="display: none;">
    <div class="modal-container">

        <div class="modal-header">
            <h2 id="modal-title" class="modal-title">{{ i18n "license_modal_title" }}</h2>
            <button type="button" id="modal-close" class="modal-close" aria-label="{{ i18n "close" }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        {{- $isRu := eq site.Language.Lang "ru" -}}
        <div class="modal-tabs-container">
            <div class="modal-tabs">
                <button type="button" class="modal-tab{{ if $isRu }} active{{ end }}" data-lang="ru">RU</button>
                <button type="button" class="modal-tab{{ if not $isRu }} active{{ end }}" data-lang="en">EN</button>
            </div>
            <div class="modal-view-toggle">
                <button type="button" class="modal-view-btn active" data-view="permissions">{{ i18n "license_tab_permissions" }}</button>
                <button type="button" class="modal-view-btn" data-view="text">{{ i18n "license_tab_text" }}</button>
            </div>
        </div>

        <div id="modal-body" class="modal-body"></div>

    </div>
</div>
