<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="{{ i18n "aria_search" }}">
    <div class="search-modal-backdrop"></div>
    <div class="search-modal-content">
        <div class="search-modal-header">
            <svg width="20" height="20" aria-hidden="true">
                <use href="{{ "icons.svg#icon-search" | relURL }}"></use>
            </svg>
            <input type="search" id="search-input" placeholder="{{ site.Params.searchPlaceholder | default (i18n "search_placeholder") }}" autocomplete="off" aria-label="{{ i18n "aria_search" }}">
            <button type="button" class="search-modal-close" aria-label="{{ i18n "close" }}">
                <svg class="search-close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <kbd>Esc</kbd>
            </button>
        </div>
        <div class="search-results" id="search-results" aria-live="polite"></div>
    </div>
</div>
