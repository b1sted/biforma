{{ if and (not .Params.hideToc) .TableOfContents (gt (len .TableOfContents) 100) }}
<aside class="toc-sidebar" aria-label="Table of contents">
    <h3 class="toc-title" id="toc-title">{{ i18n "toc_title" }}</h3>
    <nav class="toc-nav" aria-labelledby="toc-title">
        {{ .TableOfContents }}
    </nav>
</aside>
{{ end }}
