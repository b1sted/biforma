{{- $scale := .Get "scale" | default "" -}}
{{- $caption := .Get "caption" | default (.Get "title") | default "" -}}
{{- $raw := trim .Inner "\n\r" -}}

<figure class="article-figure mermaid-wrapper" data-pagefind-ignore>
    <div class="mermaid js-mermaid-lightbox" data-diagram="{{ $raw | base64Encode }}"{{ with $scale }} data-scale="{{ . }}"{{ end }}></div>
    {{- with $caption -}}
    <figcaption class="figure-caption">{{ . }}</figcaption>
    {{- end -}}
</figure>
