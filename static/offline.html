<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline</title>
    <style>
        :root {
            color-scheme: dark light;
        }
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
        }
        @media (prefers-color-scheme: light) {
            body {
                background: #f8f8f8;
                color: #2a2a2a;
            }
            .offline-button {
                color: #ffffff;
            }
        }
        .offline-container {
            max-width: 520px;
        }
        .offline-icon {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.75rem;
            margin: 0 0 12px;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 0 24px;
            color: #a0a0a0;
        }
        @media (prefers-color-scheme: light) {
            p {
                color: #595959;
            }
        }
        .offline-button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            background: #5ca1f1;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }
        .offline-button:hover {
            background: #4a90e2;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon" aria-hidden="true">📵</div>
        <h1 data-offline-title>You are offline</h1>
        <p data-offline-text>Check your internet connection and try again.</p>
        <a class="offline-button" href="./" data-offline-link>Back to home</a>
    </div>
    <script>
        (function () {
            var lastPage = '';
            try { lastPage = sessionStorage.getItem('last_valid_page') || ''; } catch (e) {}
            var path = lastPage ? new URL(lastPage, window.location.href).pathname : (window.location.pathname || '/');
            var isRussian = /^\/ru(?:\/|$)/i.test(path) || (!/^\/en(?:\/|$)/i.test(path) && /^ru\b/i.test(navigator.language || ''));
            if (!isRussian) return;
            document.documentElement.lang = 'ru';
            document.title = 'Офлайн';
            document.querySelector('[data-offline-title]').textContent = 'Вы офлайн';
            document.querySelector('[data-offline-text]').textContent = 'Проверьте подключение к интернету и попробуйте снова.';
            document.querySelector('[data-offline-link]').textContent = 'Вернуться на главную';
        })();
    </script>
</body>
</html>
